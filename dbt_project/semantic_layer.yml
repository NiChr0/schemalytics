    - revenue_reporting

    - conversion_optimization

    - customer_lifetime_value

    - inventory_tracking

    - product_performance


# =============================================================================
# DATA MODEL OVERVIEW
# =============================================================================
architecture:
  pattern: Medallion (Bronze → Silver → Gold)
  approach: Kimball dimensional modeling
  
layers:
  bronze:
    description: Raw data passthrough from source systems
    materialization: view
    purpose: Exact replica of source data for auditing and reprocessing
    query_usage: Rarely queried directly; use for data exploration only
    
  silver:
    description: Cleaned dimensional models (facts and dimensions)
    materialization: table
    purpose: Structured star schema for flexible analytical queries
    query_usage: Use for detailed analysis requiring granular data
    
  gold:
    description: Pre-aggregated metrics optimized for performance
    materialization: table
    purpose: Fast dashboards and common reporting use cases
    query_usage: Primary layer for analytics - always check Gold first

# =============================================================================
# METRICS CATALOG
# =============================================================================
metrics:

  - name: gold_daily_revenue
    display_name: "Daily revenue and order metrics"
    layer: gold
    grain: daily
    source_fact: fct_orders
    refresh_frequency: "Depends on dbt schedule (typically daily)"
    
    measures:

      - name: total_revenue
        aggregation: SUM
        source_column: amount
        data_type: "NUMERIC"
        description: Total daily revenue
        sql_formula: "SUM(amount)"
        null_handling: "NULLs are excluded from aggregations"
        use_cases:

          - "Track total revenue by daily"
          - "Calculate revenue growth rates"
          - "Compare revenue across time periods"

        example_queries:
          - description: "Get total_revenue for last 30 days"
            sql: "SELECT daily_date, total_revenue FROM gold_daily_revenue WHERE order_date >= CURRENT_DATE - 30 ORDER BY daily_date"
          - description: "Compare total_revenue month-over-month"
            sql: "SELECT daily_date, total_revenue, LAG(total_revenue) OVER (ORDER BY daily_date) as previous_period FROM gold_daily_revenue"

      - name: order_count
        aggregation: COUNT
        source_column: *
        data_type: "INTEGER"
        description: Number of orders
        sql_formula: "COUNT(*)"
        null_handling: "NULLs are excluded from aggregations"
        use_cases:

          - "Monitor daily activity volume"
          - "Track growth in transaction count"
          - "Calculate conversion rates"

        example_queries:
          - description: "Get order_count for last 30 days"
            sql: "SELECT daily_date, order_count FROM gold_daily_revenue WHERE order_date >= CURRENT_DATE - 30 ORDER BY daily_date"
          - description: "Compare order_count month-over-month"
            sql: "SELECT daily_date, order_count, LAG(order_count) OVER (ORDER BY daily_date) as previous_period FROM gold_daily_revenue"

    
    time_column: order_date
    dimensions:

      - "time (daily)"

    
    common_filters:
      - "WHERE daily_date >= CURRENT_DATE - INTERVAL '30 days'"
      - "WHERE daily_date BETWEEN '[start_date]' AND '[end_date]'"
      - "WHERE EXTRACT(YEAR FROM daily_date) = EXTRACT(YEAR FROM CURRENT_DATE)"
    


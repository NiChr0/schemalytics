## Facts (Measurable Events)
facts:

  - name: fct_order_details
    display_name: "Order_details"
    source_table: order_details
    grain: One row per order_detail
    description: "Transactional data capturing measurable events"
    
    date_column: created_at
    date_description: "Primary date for time-based analysis"
    
    measures:

      - name: unit_price
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]

      - name: discount
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]

    
    dimension_keys:

      - order_id

      - product_id

    
    relationships:

      - foreign_key: order_id
        references: "dim_order"
        cardinality: "many-to-one"
        description: "Each order_details record links to one order"

      - foreign_key: product_id
        references: "dim_product"
        cardinality: "many-to-one"
        description: "Each order_details record links to one product"

    
    typical_use_cases:
      - "Detailed transaction-level analysis"
      - "Calculate custom metrics not available in Gold"
      - "Drill down from Gold aggregates"
    
    join_pattern: |
      SELECT 
        f.*,

        d_1.attribute_name

        d_2.attribute_name

      FROM fct_order_details f

      LEFT JOIN dim_order d_1 
        ON f.order_id = d_1.order_id

      LEFT JOIN dim_product d_2 
        ON f.product_id = d_2.product_id

      WHERE f.created_at >= CURRENT_DATE - 30
    

  - name: fct_employee_territories
    display_name: "Employee_territories"
    source_table: employee_territories
    grain: One row per employee_territorie
    description: "Transactional data capturing measurable events"
    
    date_column: created_at
    date_description: "Primary date for time-based analysis"
    
    measures:

    
    dimension_keys:

      - employee_id

      - territory_id

    
    relationships:

      - foreign_key: employee_id
        references: "dim_employee"
        cardinality: "many-to-one"
        description: "Each employee_territories record links to one employee"

      - foreign_key: territory_id
        references: "dim_territory"
        cardinality: "many-to-one"
        description: "Each employee_territories record links to one territory"

    
    typical_use_cases:
      - "Detailed transaction-level analysis"
      - "Calculate custom metrics not available in Gold"
      - "Drill down from Gold aggregates"
    
    join_pattern: |
      SELECT 
        f.*,

        d_1.attribute_name

        d_2.attribute_name

      FROM fct_employee_territories f

      LEFT JOIN dim_employee d_1 
        ON f.employee_id = d_1.employee_id

      LEFT JOIN dim_territory d_2 
        ON f.territory_id = d_2.territory_id

      WHERE f.created_at >= CURRENT_DATE - 30
    

  - name: fct_orders
    display_name: "Orders"
    source_table: orders
    grain: One row per order
    description: "Transactional data capturing measurable events"
    
    date_column: order_date
    date_description: "Primary date for time-based analysis"
    
    measures:

      - name: freight
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]

    
    dimension_keys:

      - customer_id

      - employee_id

      - ship_via

    
    relationships:

      - foreign_key: customer_id
        references: "dim_customer"
        cardinality: "many-to-one"
        description: "Each orders record links to one customer"

      - foreign_key: employee_id
        references: "dim_employee"
        cardinality: "many-to-one"
        description: "Each orders record links to one employee"

      - foreign_key: ship_via
        references: "dim_ship_via"
        cardinality: "many-to-one"
        description: "Each orders record links to one ship_via"

    
    typical_use_cases:
      - "Detailed transaction-level analysis"
      - "Calculate custom metrics not available in Gold"
      - "Drill down from Gold aggregates"
    
    join_pattern: |
      SELECT 
        f.*,

        d_1.attribute_name

        d_2.attribute_name

        d_3.attribute_name

      FROM fct_orders f

      LEFT JOIN dim_customer d_1 
        ON f.customer_id = d_1.customer_id

      LEFT JOIN dim_employee d_2 
        ON f.employee_id = d_2.employee_id

      LEFT JOIN dim_ship_via d_3 
        ON f.ship_via = d_3.ship_via

      WHERE f.order_date >= CURRENT_DATE - 30
    

  - name: fct_products
    display_name: "Products"
    source_table: products
    grain: One row per product
    description: "Transactional data capturing measurable events"
    

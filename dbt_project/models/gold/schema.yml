version: 2

models:

  - name: gold_daily_revenue
    description: "Daily revenue and order metrics"
    meta:
      layer: gold
      grain: daily
      refresh: daily
    columns:
      - name: daily_date
        description: "Date at daily grain"
        tests:
          - unique
          - not_null
      

      - name: total_revenue
        description: "Total daily revenue"
        meta:
          aggregation: SUM
          source_column: amount

      - name: order_count
        description: "Number of orders"
        meta:
          aggregation: COUNT
          source_column: *


  - name: gold_monthly_customer_lifetime_value
    description: "Monthly customer lifetime value"
    meta:
      layer: gold
      grain: monthly
      refresh: daily
    columns:
      - name: monthly_date
        description: "Date at monthly grain"
        tests:
          - unique
          - not_null
      

      - name: lifetime_revenue
        description: "Total lifetime revenue per customer"
        meta:
          aggregation: SUM
          source_column: unit_price * quantity - discount

      - name: order_count
        description: "Number of orders per customer"
        meta:
          aggregation: COUNT
          source_column: *


  - name: gold_yearly_product_performance
    description: "Yearly product performance metrics"
    meta:
      layer: gold
      grain: yearly
      refresh: daily
    columns:
      - name: yearly_date
        description: "Date at yearly grain"
        tests:
          - unique
          - not_null
      

      - name: total_revenue
        description: "Total yearly revenue per product"
        meta:
          aggregation: SUM
          source_column: unit_price * quantity - discount

      - name: order_count
        description: "Number of orders per product"
        meta:
          aggregation: COUNT
          source_column: *


  - name: gold_daily_inventory_tracking
    description: "Daily inventory tracking and sales metrics"
    meta:
      layer: gold
      grain: daily
      refresh: daily
    columns:
      - name: daily_date
        description: "Date at daily grain"
        tests:
          - unique
          - not_null
      

      - name: total_units_sold
        description: "Total units sold daily"
        meta:
          aggregation: SUM
          source_column: quantity

      - name: total_revenue
        description: "Total revenue generated daily"
        meta:
          aggregation: SUM
          source_column: unit_price * quantity - discount


  - name: gold_monthly_conversion_optimization
    description: "Monthly conversion optimization metrics"
    meta:
      layer: gold
      grain: monthly
      refresh: daily
    columns:
      - name: monthly_date
        description: "Date at monthly grain"
        tests:
          - unique
          - not_null
      

      - name: conversion_rate
        description: "Average conversion rate per customer"
        meta:
          aggregation: AVG
          source_column: (CASE WHEN order_status = 'Completed' THEN 1 ELSE 0 END)

      - name: average_order_value
        description: "Average order value per customer"
        meta:
          aggregation: AVG
          source_column: amount

